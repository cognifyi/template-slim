# E2E Smoke Tests — PR (Built from Source)
#
# Runs when nx affected detects changes to E2E-relevant projects
# (api, web, worker, e2e, SDKs, API clients). Builds from source, starts
# Postgres + Redis + API + web, and runs the Playwright smoke suite
# (apps/e2e, <10min). Full regression stays in nightly (if configured).

name: '[E2E] PR Smoke Tests'

on:
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-pr-tests:
    name: E2E smoke (from source)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - run: corepack enable

      - name: Get yarn cache directory
        id: yarn-cache
        run: echo "dir=$(yarn config get cacheFolder)" >> $GITHUB_OUTPUT

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: yarn-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-${{ runner.arch }}-

      - run: yarn install --immutable

      - name: Check if E2E-relevant projects are affected
        id: affected
        run: |
          if ! AFFECTED=$(npx nx show projects --affected --base=origin/${{ github.event.pull_request.base.ref }} --head=HEAD); then
            echo "Failed to determine affected projects"
            exit 1
          fi
          echo "Affected projects: $AFFECTED"
          if echo "$AFFECTED" | grep -qE '^(api|web|worker|e2e|sdk-typescript|sdk-python|sdk-go|api-client|api-client-go|api-client-python)$'; then
            echo "affected=true" >> $GITHUB_OUTPUT
          else
            echo "affected=false" >> $GITHUB_OUTPUT
            echo "No E2E-relevant projects affected — skipping"
          fi

      - uses: ./.github/actions/setup-toolchain
        if: steps.affected.outputs.affected == 'true'

      - name: Start infrastructure (postgres, redis)
        if: steps.affected.outputs.affected == 'true'
        run: |
          docker compose -f apps/e2e/docker-compose.e2e.yaml up -d --wait
          docker compose -f apps/e2e/docker-compose.e2e.yaml ps

      - name: Install Playwright Chromium
        if: steps.affected.outputs.affected == 'true'
        run: npx playwright install --with-deps chromium

      - name: Build services needed for E2E
        if: steps.affected.outputs.affected == 'true'
        run: |
          source "$(poetry env info --path)/bin/activate"
          VERSION=v0.0.0-dev yarn nx run-many --target=build --projects=api,web,worker

      - name: Run DB migrations
        if: steps.affected.outputs.affected == 'true'
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USERNAME: user
          DB_PASSWORD: pass
          DB_DATABASE: app
        run: yarn migration:run:init

      - name: Start API and web
        if: steps.affected.outputs.affected == 'true'
        run: |
          set -a
          source apps/e2e/.env.e2e
          set +a
          export DB_HOST=localhost DB_PORT=5432 DB_USERNAME=user DB_PASSWORD=pass DB_DATABASE=app
          export REDIS_HOST=localhost REDIS_PORT=6379
          npx nx serve api --configuration=development > /tmp/api.log 2>&1 &
          echo $! > /tmp/api.pid
          npx nx serve web --configuration=development > /tmp/web.log 2>&1 &
          echo $! > /tmp/web.pid

      - name: Wait for services to be ready
        if: steps.affected.outputs.affected == 'true'
        run: |
          echo "Waiting for API at http://localhost:3001/api/health ..."
          for i in $(seq 1 90); do
            if curl -sf http://localhost:3001/api/health > /dev/null 2>&1; then
              echo "API is ready (attempt $i)"
              break
            fi
            if [ "$i" = "90" ]; then
              echo "API failed to start within 180s"
              tail -100 /tmp/api.log 2>/dev/null || echo "No API logs found"
              exit 1
            fi
            sleep 2
          done
          echo "Waiting for web at http://localhost:3000/health ..."
          for i in $(seq 1 45); do
            if curl -sf http://localhost:3000/health > /dev/null 2>&1; then
              echo "Web is ready (attempt $i)"
              exit 0
            fi
            sleep 2
          done
          echo "Web failed to start within 90s"
          tail -100 /tmp/web.log 2>/dev/null || echo "No web logs found"
          exit 1

      - name: Run Playwright smoke tests
        if: steps.affected.outputs.affected == 'true'
        env:
          API_BASE_URL: http://localhost:3001
          WEB_BASE_URL: http://localhost:3000
        run: yarn nx run e2e:test:e2e

      - name: Dump service logs
        if: always() && steps.affected.outputs.affected == 'true'
        run: |
          for svc in api web; do
            echo "=== ${svc} logs (last 200 lines) ==="
            tail -200 /tmp/${svc}.log 2>/dev/null || echo "No ${svc} logs found"
          done

      - name: Stop services
        if: always() && steps.affected.outputs.affected == 'true'
        run: |
          for svc in api web; do
            if [ -f /tmp/${svc}.pid ]; then
              kill $(cat /tmp/${svc}.pid) 2>/dev/null || true
            fi
          done

      - name: Tear down infrastructure
        if: always() && steps.affected.outputs.affected == 'true'
        run: docker compose -f apps/e2e/docker-compose.e2e.yaml down -v
