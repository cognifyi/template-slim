name: '[PR] Docker build'

on:
  pull_request:

permissions:
  contents: read

env:
  BUILDX_NO_DEFAULT_ATTESTATIONS: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-build:
    if: github.event.pull_request.head.repo.full_name == github.repository
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VERSION: v0.0.0-pr
      NX_DAEMON: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          install-python: 'false'
          install-poetry: 'false'
          install-swag: 'false'
          run-poetry-install: 'false'

      - name: Ensure go.work.sum exists
        # The composite runs `go work sync` but does not `touch go.work.sum`.
        # When sync has nothing to write, the file is not created, and the Go
        # Dockerfiles' `COPY go.work go.work.sum` fails. Matches release.yaml:270.
        run: touch go.work.sum

      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@19215110ab936351210feebdfa5b440b4493e184 # v2.2.0

      - name: Build all Docker targets
        run: |
          yarn nx run-many \
            --target=docker \
            --projects=api,web,worker \
            --configuration=pr-build \
            --parallel=2 \
            --nxBail=true
