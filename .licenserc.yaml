header:
  license:
    spdx-id: Apache-2.0
    copyright-owner: TemplateOrg
    content: |
      Copyright TemplateOrg.
      SPDX-License-Identifier: Apache-2.0
    pattern: |
      Copyright (\d{4} )?TemplateOrg\.
      SPDX-License-Identifier: Apache-2\.0
  paths:
    - '**/*.go'
    - '**/*.sh'
    - '**/*.js'
    - '**/*.ts'
    - '**/*.tsx'
    - '**/*.py'

  paths-ignore:
    - 'libs/**'
    - 'apps/api/src/generate-openapi.ts'
    - 'apps/docs/**'
    - 'hack/**'

  comment: on-failure
