header:
  license:
    spdx-id: Apache-2.0
    copyright-owner: TemplateOrg
    content: |
      Copyright TemplateOrg.
      SPDX-License-Identifier: Apache-2.0
    pattern: |
      Copyright (\d{4} )?TemplateOrg\.
      SPDX-License-Identifier: Apache-2\.0
  paths:
    - 'libs/**/*.go'
    - 'libs/**/*.sh'
    - 'libs/**/*.js'
    - 'libs/**/*.ts'
    - 'libs/**/*.tsx'
    - 'libs/**/*.py'

  paths-ignore:
    - 'libs/api-client/**'
    - 'libs/api-client-go/**'
    - 'libs/api-client-python/**'
    - 'apps/docs/**'
    - 'hack/**'

  comment: on-failure
