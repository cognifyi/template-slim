services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    privileged: true
    volumes:
      - ..:/workspaces/template-slim

  # Local OIDC provider for API login in development.
  # The API boots only when OIDC discovery succeeds; point OIDC_ISSUER_BASE_URL
  # here or at your own provider. Safe to remove if you don't use OIDC login.
  dex:
    image: dexidp/dex:v2.42.0
    volumes:
      - ./dex/config.yaml:/etc/dex/config.yaml
    command: ['dex', 'serve', '/etc/dex/config.yaml']
    network_mode: service:app

  db:
    image: postgres:18
    environment:
      - POSTGRES_PASSWORD=pass
      - POSTGRES_USER=user
      - POSTGRES_DB=app

  redis:
    image: redis:7-alpine

  # Local image registry for the `docker` nx targets (api/web/worker).
  registry:
    image: registry:2.8.2
    restart: always
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: 'true'
    volumes:
      - registry:/var/lib/registry

volumes:
  registry: {}
