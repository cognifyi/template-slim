openapi: 3.0.0
info:
  contact:
    email: support@example.com
    name: TemplateOrg
    url: https://example.com
  description: TemplateSlim API Docs
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  title: TemplateSlim API
  version: "1.0"
servers:
- url: http://localhost:3001
paths:
  /config:
    get:
      operationId: ConfigController_getConfig
      parameters: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateSlimConfiguration"
          description: Daytona configuration
      summary: Get config
      tags:
      - config
  /api-keys:
    get:
      operationId: listApiKeys
      parameters:
      - description: Use with JWT to specify the organization ID
        explode: false
        in: header
        name: X-Daytona-Organization-ID
        required: false
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/ApiKeyList"
                type: array
          description: API keys retrieved successfully.
        "500":
          description: Error fetching API keys.
      security:
      - bearer: []
      - oauth2:
        - openid
        - profile
        - email
      summary: List API keys
      tags:
      - api-keys
    post:
      operationId: createApiKey
      parameters:
      - description: Use with JWT to specify the organization ID
        explode: false
        in: header
        name: X-Daytona-Organization-ID
        required: false
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApiKey"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyResponse"
          description: API key created successfully.
      security:
      - bearer: []
      - oauth2:
        - openid
        - profile
        - email
      summary: Create API key
      tags:
      - api-keys
  /api-keys/current:
